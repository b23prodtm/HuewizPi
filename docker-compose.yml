version: '2.1'

services:
  deconz:
    image: deconzcommunity/deconz:stable
    container_name: deconz
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
      - "4443:4443"
    volumes:
      - deCONZ:/opt/deCONZ
    devices:
      - /dev/ttyAMA0
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DECONZ_WEB_PORT: 8080
      DECONZ_WS_PORT: 4443
      DEBUG_INFO: 1
      DEBUG_APS: 0
      DEBUG_ZCL: 0
      DEBUG_ZDP: 0
      DEBUG_OTA: 0
      DEBUG_HTTP: 0
      DECONZ_DEVICE: ${DECONZ_DEVICE:-/dev/ttyAMA0}
      DECONZ_START_VERBOSE: 0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  homebridge:
    image: homebridge/homebridge:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - homebridge:/homebridge
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8581', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  wifi-spot:
    container_name: hwzpi
    network_mode: host
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.armhf
    privileged: true
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: ${DBUS_SYSTEM_BUS_ADDRESS:-unix:path=/host/run/dbus/system_bus_socket}
    labels:
      io.balena.features.dbus: "1"
      io.balena.features.kernel-modules: "1"
      io.balena.features.firmware: "1"
    volumes:
      - hostapd:/etc/hostapd
      - hapwizard:/etc/hapwizard
      - netplan:/etc/netplan
    cap_add:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "/etc/init.d/hapwizard status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-passbolt}
      MYSQL_USER: ${MYSQL_USER:-passbolt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-passbolt_dev_password}
    volumes:
      - database_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 40s

  passbolt:
    image: passbolt/passbolt:latest-ce
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_FULL_BASE_URL: ${APP_FULL_BASE_URL:-https://passbolt.local}
      DATASOURCES_DEFAULT_HOST: db
      DATASOURCES_DEFAULT_USERNAME: ${MYSQL_USER:-passbolt}
      DATASOURCES_DEFAULT_PASSWORD: ${MYSQL_PASSWORD:-passbolt_dev_password}
      DATASOURCES_DEFAULT_DATABASE: ${MYSQL_DATABASE:-passbolt}
    volumes:
      - gpg_volume:/etc/passbolt/gpg
      - jwt_volume:/etc/passbolt/jwt
    command: ["/usr/bin/wait-for.sh", "-t", "0", "db:3306", "--", "/docker-entrypoint.sh"]
    ports:
      - "${PASSBOLT_SMTP_PORT:-587}:587"
      - "${PASSBOLT_HTTP_PORT:-8088}:80"
      - "${PASSBOLT_HTTPS_PORT:-8443}:443"
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',80); if($$s){fclose($$s);exit(0);} exit(1);"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  database_volume:
  gpg_volume:
  jwt_volume:
  hostapd:
  hapwizard:
  netplan:
  config:
  homebridge:
  deCONZ:
