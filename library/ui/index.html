<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuewizPi Wi-Fi setup</title>
<style>
body{font-family:sans-serif;max-width:28rem;margin:2rem auto;padding:0 1rem}
label,input,button{display:block;width:100%;margin:.5rem 0;box-sizing:border-box}
input,button{padding:.6rem;font-size:1rem}
</style>
</head>
<body>
<h1>HuewizPi</h1>
<p>Enter the Wi-Fi network this device should join. The setup hotspot closes once it is connected.</p>
<form method="POST" action="/">
  <label for="ssid">Network name (SSID)</label>
  <input id="ssid" name="ssid" autocapitalize="none">
  <label for="hidden-ssid">Hidden network name (optional)</label>
  <input id="hidden-ssid" name="hidden-ssid" autocapitalize="none">
  <label for="identity">Enterprise network identity (if required)</label>
  <input id="identity" name="identity" autocomplete="username">
  <label for="passphrase">Password (leave empty for an open network)</label>
  <input id="passphrase" name="passphrase" type="password" autocomplete="off">
  <button type="submit">Connect</button>
</form>
<p>Tip: set <code>WIFI_SSID</code> and the <code>WIFI_PASSWORD</code> secret in your Balena fleet to skip this page.</p>
</body>
</html>
