name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare test environment
        run: |
          cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.x86_64 config

      - name: Build all services
        run: docker compose -f docker-compose.x86_64 build --pull

      - name: Start compose stack
        run: |
          docker compose -f docker-compose.x86_64 up -d db passbolt homebridge
          docker compose -f docker-compose.x86_64 ps

      - name: Wait for healthy services
        run: |
          set -eu
          services="db passbolt homebridge"
          deadline=$((SECONDS + 600))

          while [ "$SECONDS" -lt "$deadline" ]; do
            all_healthy=1
            for service in $services; do
              cid=$(docker compose -f docker-compose.x86_64 ps -q "$service")
              if [ -z "$cid" ]; then
                echo "$service container not found"
                all_healthy=0
                continue
              fi

              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
              echo "$service status: $status"
              if [ "$status" != "healthy" ]; then
                all_healthy=0
              fi
            done

            if [ "$all_healthy" -eq 1 ]; then
              echo "All required services are healthy"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for services"
          exit 1

      - name: Verify service availability
        run: |
          set -eu
          docker compose -f docker-compose.x86_64 exec -T db sh -lc 'mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent'
          curl -kfsS https://127.0.0.1:8443/ >/dev/null || curl -fsS http://127.0.0.1:8088/ >/dev/null
          curl -fsS http://127.0.0.1:8581/ >/dev/null

      - name: Run integration checks
        run: |
          set -eu
          docker compose -f docker-compose.x86_64 ps

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.x86_64 ps || true
          docker compose -f docker-compose.x86_64 logs db || true
          docker compose -f docker-compose.x86_64 logs passbolt || true
          docker compose -f docker-compose.x86_64 logs homebridge || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.x86_64 down -v --remove-orphans || true
