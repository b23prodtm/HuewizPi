name: HuewizPi
description: >-
  Balena-first Raspberry Pi stack for Wi-Fi access-point services, Passbolt, and Homebridge.
version: 1.1.0
type: sw.application
assets:
  repository:
    type: blob.asset
    data:
      url: 'https://github.com/b23prodtm/HuewizPi'
  logo:
    type: blob.asset
    data:
      url: 'https://github.com/b23prodtm/HuewizPi/blob/master/Home_Assistant_Logo.svg.png?raw=true'
data:
  defaultDeviceType: raspberrypi3
  supportedDeviceTypes:
    - raspberrypi3
  applicationEnvironmentVariables:
    - APP_FULL_BASE_URL: 'https://passbolt.local'
    - MYSQL_DATABASE: 'passbolt'
    - MYSQL_USER: 'passbolt'
    - MYSQL_PASSWORD: 'set-in-balena-cloud'
post-provisioning: >-
  Deploy from Balena Cloud by connecting this repository to your fleet.
  Set fleet/device environment variables before first startup, then deploy.
